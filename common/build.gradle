plugins {
    id 'multiloader-common'
    // NeoForge moddev plugin removed on the 1.21.11 Fabric-only branch.
    // The common project is a pure source/resources exporter here: the fabric project
    // compiles these sources against its own loom-provided Minecraft classpath
    // (see build-logic/multiloader-loader.gradle -> source(configurations.commonJava)).
}

// No standalone compile dependencies on this branch: common's own compileJava is never
// executed (nothing depends on it once :fabric consumes commonJava/commonResources only).

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.matching { it.name == variant }.configureEach {
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.matching { it.name == variant }.configureEach {
            attributes {
                attribute(loaderAttribute, 'common')
            }
        }
    }
}
