# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Mod Properties
version=3.2.1
group=noobtrieu.reimaginedintro
mod_id=reimagined-intro
mod_name=Reimagined Intro
mod_author=NoobTrieu
license=MIT
description=Replaces Minecraft's intro with a new Mojang animation and the official Minecraft channel outro!
credits=

# Common / Minecraft Properties (1.21.11 port, VulkanMod-compatible)
java_version=21
minecraft_version=1.21.11
minecraft_version_range=[1.21.11, 1.21.12)
neo_form_version=26.3-1

# Fabric Properties
fabric_version=0.140.0+1.21.11
fabric_loader_version=0.18.4
# loom 1.18+ requires a Java 25 runtime; 1.21.11 toolchain targets Java 21,
# so pin the same loom generation VulkanMod 0.6.8+1.21.11 builds with (1.14.x).
loom_version=1.13.6

# NeoForge Properties (module excluded on this branch - VulkanMod is Fabric-only)
neoforge_version=26.3.0.95
neoforge_loader_version_range=[4,)
moddev_version=2.0.147
