modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${license}"

[[mods]]
modId = "reimagined_intro"
version = "${version}"
displayName = "${mod_name}"
iconFile = "assets/reimagined-intro/icon.png"
authors = "${mod_author}"
description = '''${description}'''

[[mixins]]
config = "reimagined-intro.mixins.json"

[[dependencies.reimagined_intro]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.reimagined_intro]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
